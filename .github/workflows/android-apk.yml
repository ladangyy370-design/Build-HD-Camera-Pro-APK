
name: Build HD Camera Pro APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        run: unzip -o HDCP_v051_Fix.zip

      - name: Build APK
        run: gradle --no-daemon -p HD_Camera_Pro_Cloud :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HD-Camera-Pro-v0.5.1-APK
          path: HD_Camera_Pro_Cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
