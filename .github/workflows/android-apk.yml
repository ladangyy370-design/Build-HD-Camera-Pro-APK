
name: Build HD Camera Pro APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: unzip -o HD_Camera_Pro_v0_4_3D_LUT.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon -p HD_Camera_Pro_Cloud :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-Camera-Pro-debug-APK
          path: HD_Camera_Pro_Cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
